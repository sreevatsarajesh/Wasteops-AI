[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wasteops"
version = "1.0.0"
description = "AI-powered waste material intelligence"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pillow",
    "numpy",
    "scikit-learn",
    "torch",
    "torchvision",
    "transformers",
    "tqdm",
    "pydantic",
    "python-dotenv"
]

[tool.setuptools.packages.find]
include = ["wasteops*"]
